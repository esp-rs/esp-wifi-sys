[package]
name        = "esp-wifi-sys-esp32s31"
version     = "0.3.0"
edition     = "2021"
description = "Bindings to Espressif's WiFi and Bluetooth low-level drivers for ESP32-S31"
repository  = "https://github.com/esp-rs/esp-wifi-sys"
license     = "MIT OR Apache-2.0"

keywords   = ["bluetooth", "esp", "no-std", "wifi"]
categories = ["embedded", "hardware-support", "no-std"]

[dependencies]
log   = { version = "0.4.25", optional = true }
defmt = { version = "1.0.1", optional = true }

[features]
default = []

# Enable log output from binary blobs - requires nightly
sys-logs = []

# Link the Wi-Fi driver libraries
wifi = []
# Link the Bluetooth controller libraries
bt = []
# Link the libraries needed by the IEEE 802.15.4 driver
ieee802154 = []

[package.metadata.docs.rs]
features = []
